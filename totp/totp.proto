syntax = "proto3";
package openim.totp;

option go_package = "github.com/openimsdk/protocol/totp";

// GetSecretReq is called by a logged-in user to initiate TOTP binding.
message GetSecretReq {
  string userID    = 1;
  string issuer    = 2; // e.g. "SOK-IM"
  string accountName = 3; // e.g. phone number
}

message GetSecretResp {
  string secret     = 1; // Base32-encoded shared secret
  string otpAuthUrl = 2; // otpauth://totp/... URI for QR code
  int64  expireAt   = 3; // Unix seconds when the temporary secret expires (10 min)
}

// BindTotpReq is called after the user scans the QR code and inputs the first code.
message BindTotpReq {
  string userID   = 1;
  string totpCode = 2; // 6-digit dynamic code from Authenticator
}

message BindTotpResp {
  repeated string recoveryCodes = 1; // 8 one-time recovery codes, shown only once
}

// VerifyTotpReq is the second step of login when TOTP is enabled.
message VerifyTotpReq {
  string mfaToken = 1; // temporary token from the first login step
  string totpCode = 2; // 6-digit TOTP code or 8-char recovery code
  int32  platform = 3; // 1:iOS 2:Android 3:Windows 4:macOS 5:Web
}

message VerifyTotpResp {
  string userID              = 1;
  bool   recoveryCodesLow   = 2; // true when remaining recovery codes < 3
  int32  recoveryCodesLeft  = 3;
}

// GetStatusReq queries the TOTP binding status for a user.
message GetStatusReq {
  string userID = 1;
}

message GetStatusResp {
  bool   enabled                 = 1;
  int64  boundAt                 = 2; // Unix seconds; 0 if not bound
  int32  recoveryCodesRemaining  = 3;
}

// UnbindTotpReq removes TOTP binding after verifying the user's code.
message UnbindTotpReq {
  string userID   = 1;
  string totpCode = 2; // 6-digit TOTP code or 8-char recovery code
}

message UnbindTotpResp {}

// CreateMfaTokenReq is called by the auth service when a user passes primary
// authentication and has TOTP enabled. It returns a short-lived mfaToken to
// be sent back to the client as a placeholder for the second factor.
message CreateMfaTokenReq {
  string userID = 1;
}

message CreateMfaTokenResp {
  string mfaToken  = 1;
  int64  expireAt  = 2; // Unix seconds (5 min from now)
}

// CheckTotpBoundReq is called by the auth service to decide whether to require MFA.
message CheckTotpBoundReq {
  string userID = 1;
}

message CheckTotpBoundResp {
  bool bound = 1;
}

service Totp {
  rpc GetSecret(GetSecretReq)             returns (GetSecretResp);
  rpc BindTotp(BindTotpReq)               returns (BindTotpResp);
  rpc VerifyTotp(VerifyTotpReq)           returns (VerifyTotpResp);
  rpc GetStatus(GetStatusReq)             returns (GetStatusResp);
  rpc UnbindTotp(UnbindTotpReq)           returns (UnbindTotpResp);
  rpc CreateMfaToken(CreateMfaTokenReq)   returns (CreateMfaTokenResp);
  rpc CheckTotpBound(CheckTotpBoundReq)   returns (CheckTotpBoundResp);
}
