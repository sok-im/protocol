syntax = "proto3";
package openim.sdkws;

import "wrapperspb/wrapperspb.proto";

option go_package = "github.com/openimsdk/protocol/sdkws";

////////////////////////////////base///////////////////////////////

message GroupInfo {
  string groupID = 1;
  string groupName = 2;
  string notification = 3;
  string introduction = 4;
  string faceURL = 5;
  string ownerUserID = 6;
  int64 createTime = 7;
  uint32 memberCount = 8;
  string ex = 9;
  int32 status = 10;
  string creatorUserID = 11;
  int32 groupType = 12;
  int32 needVerification = 13;
  int32 lookMemberInfo = 14;
  int32 applyMemberFriend = 15;
  int64 notificationUpdateTime = 16;
  string notificationUserID = 17;
  // allowSendMsg 0=全员可发消息 1=仅群主/管理员可发消息
  int32 allowSendMsg = 18;
  // allowPinMsg 0=全员可置顶消息 1=仅群主/管理员可置顶消息
  int32 allowPinMsg = 19;
  // allowAddMember 0=全员可拉人入群 1=仅群主/管理员可拉人入群
  int32 allowAddMember = 20;
  // allowEditGroupInfo 0=全员可编辑群资料 1=仅群主/管理员可编辑群资料
  int32 allowEditGroupInfo = 21;
  // msgBurnDuration 群消息阅后即焚时长（秒）；0 表示未开启
  int32 msgBurnDuration = 22;
  // allowBurn 0=仅群主可设置阅后即焚（默认） 1=全员可设置阅后即焚
  int32 allowBurn = 23;
  // enableInviteLink 0=关闭群邀请链接 1=开启群邀请链接
  int32 enableInviteLink = 24;
  // inviteLink 群内唯一邀请链接；请通过 list_invite_links 单独获取，不在 GroupInfo 同步中填充
  GroupInviteLinkInfo inviteLink = 25;
}

message GroupInviteLinkInfo {
  string linkID      = 1;
  string groupID     = 2;
  string creatorID   = 3;
  int64  expireAt    = 4;   // unix ms；0=永不过期
  int32  maxUseCount = 5;   // 0=不限次数
  int32  usedCount   = 6;
  bool   revoked     = 7;
  int64  createdAt   = 8;
  // shareURL 完整分享链接，由配置 shareLinkBaseURL + linkID 拼接；未配置时为空
  string shareURL    = 9;
}

message GroupInfoForSet {
  string groupID = 1;
  string groupName = 2;
  string notification = 3;
  string introduction = 4;
  string faceURL = 5;
  openim.protobuf.StringValue ex = 6;
  openim.protobuf.Int32Value needVerification = 7;
  openim.protobuf.Int32Value lookMemberInfo = 8;
  openim.protobuf.Int32Value applyMemberFriend = 9;
  // allowSendMsg 0=全员可发消息 1=仅群主/管理员可发消息
  openim.protobuf.Int32Value allowSendMsg = 10;
  // allowPinMsg 0=全员可置顶消息 1=仅群主/管理员可置顶消息
  openim.protobuf.Int32Value allowPinMsg = 11;
  // allowAddMember 0=全员可拉人入群 1=仅群主/管理员可拉人入群
  openim.protobuf.Int32Value allowAddMember = 12;
  // allowEditGroupInfo 0=全员可编辑群资料 1=仅群主/管理员可编辑群资料
  openim.protobuf.Int32Value allowEditGroupInfo = 13;
  // allowBurn 0=仅群主可设置阅后即焚（默认） 1=全员可设置阅后即焚
  openim.protobuf.Int32Value allowBurn = 14;
  // enableInviteLink 0=关闭群邀请链接 1=开启群邀请链接
  openim.protobuf.Int32Value enableInviteLink = 15;
}

message GroupMemberFullInfo {
  string groupID = 1;
  string userID = 2;
  int32 roleLevel = 3;
  int64 joinTime = 4;
  string nickname = 5;
  string faceURL = 6;
  int32 appMangerLevel = 7; //if >0
  int32 joinSource = 8;
  string operatorUserID = 9;
  string ex = 10;
  int64 muteEndTime = 11;
  string inviterUserID = 12;
  bool isPinned = 13;
  bool isMsgDestruct = 14;
  int64 msgDestructTime = 15;
  int32 burnDuration = 16;
}

message PublicUserInfo {
  string userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
}

message UserInfo {
  string userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
  int64 createTime = 5;
  int32 appMangerLevel = 6;
  int32 globalRecvMsgOpt = 7;
  // phone 仅对有权限的 viewer 下发，无权限时为空字符串
  string phone = 8;
  // areaCode 手机国际区号（如 +86）
  string areaCode = 15;
  // phoneVisibility 0=所有人 1=仅好友 2=隐藏
  int32 phoneVisibility = 9;
  // callAcceptSetting 0=所有人可发起 1=仅好友可发起 2=不接受任何通话
  int32 callAcceptSetting = 10;
  // msgReceiveSetting 0=所有人可发送 1=仅好友可发送 2=所有人不可发送
  int32 msgReceiveSetting = 11;
  string firstName = 12;
  string lastName = 13;
  // callRingtoneURL 用户设置的来电铃声 URL；被叫方收到 InvitationInfo 时播放主叫方的铃声
  string callRingtoneURL = 14;
  // callRingtoneName 用户设置的来电铃声名称（展示用）
  string callRingtoneName = 18;
  // callRingtoneCover 用户设置的来电铃声封面 URL
  string callRingtoneCover = 19;
  // callRingtoneAuthor 用户设置的来电铃声作者
  string callRingtoneAuthor = 20;
  // groupInviteSetting 0=所有人可邀请 1=仅好友可邀请 2=所有人不可邀请
  int32 groupInviteSetting = 16;
  // msgBurnDuration 用户全局消息阅后即焚时长（秒）；0 表示关闭
  int32 msgBurnDuration = 17;
}

message UserInfoWithEx {
  string userID = 1;
  openim.protobuf.StringValue nickname = 2;
  openim.protobuf.StringValue faceURL = 3;
  openim.protobuf.StringValue ex = 4;
  openim.protobuf.StringValue firstName = 5;
  openim.protobuf.StringValue lastName = 6;
  openim.protobuf.Int32Value globalRecvMsgOpt = 7;
  openim.protobuf.StringValue phone = 8;
  openim.protobuf.StringValue areaCode = 13;
  openim.protobuf.Int32Value phoneVisibility = 9;
  openim.protobuf.Int32Value callAcceptSetting = 10;
  openim.protobuf.Int32Value msgReceiveSetting = 11;
  // callRingtoneURL 用户设置的来电铃声 URL（可选更新）
  openim.protobuf.StringValue callRingtoneURL = 12;
  // callRingtoneName 用户设置的来电铃声名称（可选更新）
  openim.protobuf.StringValue callRingtoneName = 16;
  // callRingtoneCover 用户设置的来电铃声封面 URL（可选更新）
  openim.protobuf.StringValue callRingtoneCover = 17;
  // callRingtoneAuthor 用户设置的来电铃声作者（可选更新）
  openim.protobuf.StringValue callRingtoneAuthor = 18;
  // groupInviteSetting 0=所有人可邀请 1=仅好友可邀请 2=所有人不可邀请
  openim.protobuf.Int32Value groupInviteSetting = 14;
  // msgBurnDuration 用户全局消息阅后即焚时长（秒）；0 表示关闭
  openim.protobuf.Int32Value msgBurnDuration = 15;
}

message FriendInfo {
  string ownerUserID = 1;
  string remark = 2;
  int64 createTime = 3;
  UserInfo friendUser = 4;
  int32 addSource = 5;
  string operatorUserID = 6;
  string ex = 7;
  bool isPinned = 8;
  bool isMsgDestruct = 9;
  int64 msgDestructTime = 10;
  int32 burnDuration = 11;
  bool isMute = 12;
  int64 muteDuration = 13;
  int64 muteEndTime = 14;
}

message BlackInfo {
  string ownerUserID = 1;
  int64 createTime = 2;
  PublicUserInfo blackUserInfo = 3;
  int32 addSource = 4;
  string operatorUserID = 5;
  string ex = 6;
}

message GroupRequest {
  PublicUserInfo userInfo = 1;
  GroupInfo groupInfo = 2;
  int32 handleResult = 3;
  string reqMsg = 4;
  string handleMsg = 5;
  int64 reqTime = 6;
  string handleUserID = 7;
  int64 handleTime = 8;
  string ex = 9;
  int32 joinSource = 10;
  string inviterUserID = 11;
}

message FriendRequest {
  string fromUserID = 1;
  string fromNickname = 2;
  string fromFaceURL = 3;
  string toUserID = 4;
  string toNickname = 5;
  string toFaceURL = 6;
  int32 handleResult = 7;
  string reqMsg = 8;
  int64 createTime = 9;
  string handlerUserID = 10;
  string handleMsg = 11;
  int64 handleTime = 12;
  string ex = 13;
}

///////////////////////////////////base end/////////////////////////////////////
enum PullOrder {
  PullOrderAsc = 0;
  PullOrderDesc = 1;
}
message PullMessageBySeqsReq {
  string userID = 1;
  repeated SeqRange seqRanges = 2;
  PullOrder order = 3;
}

message SeqRange {
  string conversationID = 1;
  int64 begin = 2;
  int64 end = 3;
  int64 num = 4;
}

message PullMsgs {
  repeated MsgData Msgs = 1;
  bool isEnd = 2;
  int64 endSeq = 3;
}

message PullMessageBySeqsResp {
  map<string, PullMsgs> msgs = 1;
  map<string, PullMsgs> notificationMsgs = 2;
}

message GetMaxSeqReq {
  string userID = 1;
}

message GetMaxSeqResp {
  map<string, int64> maxSeqs = 1;
  map<string, int64> minSeqs = 2;
}

message UserSendMsgResp {
  string serverMsgID = 1;
  string clientMsgID = 2;
  int64 sendTime = 3;
}

message MsgData {
  string sendID = 1;
  string recvID = 2;
  string groupID = 3;
  string clientMsgID = 4;
  string serverMsgID = 5;
  int32 senderPlatformID = 6;
  string senderNickname = 7;
  string senderFaceURL = 8;
  int32 sessionType = 9;
  int32 msgFrom = 10;
  int32 contentType = 11;
  bytes content = 12;
  int64 seq = 14;
  int64 sendTime = 15;
  int64 createTime = 16;
  int32 status = 17;
  bool isRead = 18;
  map<string, bool> options = 19;
  OfflinePushInfo offlinePushInfo = 20;
  repeated string atUserIDList = 21;
  string attachedInfo = 22;
  string ex = 23;
}
message PushMessages {
  map<string, PullMsgs> msgs = 1;
  map<string, PullMsgs> notificationMsgs = 2;
}
message OfflinePushInfo {
  string title = 1;
  string desc = 2;
  string ex = 3;
  string iOSPushSound = 4;
  bool iOSBadgeCount = 5;
  string signalInfo = 6;
}

message TipsComm {
  bytes detail = 1;
  string defaultTips = 2;
  string jsonDetail = 3;
}

//////////////////////group/////////////////////

//	OnGroupCreated()
message GroupCreatedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  repeated GroupMemberFullInfo memberList = 3;
  int64 operationTime = 4;
  GroupMemberFullInfo groupOwnerUser = 5;
  uint64 groupMemberVersion = 6;
  string groupMemberVersionID = 7;
}

//	OnGroupInfoSet()
message GroupInfoSetTips {
  GroupMemberFullInfo opUser = 1; //who do this
  int64 muteTime = 2;
  GroupInfo group = 3;
  uint64 groupMemberVersion = 4;
  string groupMemberVersionID = 5;
}

message GroupInfoSetNameTips {
  GroupMemberFullInfo opUser = 1; //who do this
  GroupInfo group = 2;
  uint64 groupMemberVersion = 3;
  string groupMemberVersionID = 4;
  // defaultTips English display text, e.g. "Alice has changed the group name to NewName"
  string defaultTips = 5;
}

// OnGroupNeedVerificationSet()
// needVerification: 0=ApplyNeedVerification 1=AllNeedVerification 2=Directly(no approval)
message GroupNeedVerificationSetTips {
  GroupMemberFullInfo opUser = 1;
  GroupInfo group = 2;
  // needVerification is the new value: 0 or 1 = approval required, 2 = no approval
  int32 needVerification = 3;
  // defaultTips English display text, e.g. "Alice enabled join approval"
  string defaultTips = 4;
}

// OnGroupFaceURLSet()
message GroupFaceURLSetTips {
  GroupMemberFullInfo opUser = 1; //who do this
  GroupInfo group = 2;
  uint64 groupMemberVersion = 3;
  string groupMemberVersionID = 4;
  // defaultTips English display text, e.g. "Alice has changed the group avatar"
  string defaultTips = 5;
}

message GroupInfoSetAnnouncementTips {
  GroupMemberFullInfo opUser = 1; //who do this
  GroupInfo group = 2;
  uint64 groupMemberVersion = 3;
  string groupMemberVersionID = 4;
}

// 群置顶消息条目（保留最近3条置顶消息）
// pinID 为该置顶记录在数据库中的唯一 id，由服务端生成
// 客户端调用取消置顶时建议优先使用 pinID 精确删除
message GroupPinnedMsgInfo {
  string pinID = 1;
  string groupID = 2;
  string conversationID = 3;
  int64 seq = 4;
  string serverMsgID = 5;
  string clientMsgID = 6;
  string sendID = 7;
  string recvID = 8;
  int32 senderPlatformID = 9;
  string senderNickname = 10;
  string senderFaceURL = 11;
  int32 sessionType = 12;
  int32 msgFrom = 13;
  int32 contentType = 14;
  string content = 15;
  repeated string atUserIDList = 16;
  map<string, bool> options = 17;
  string attachedInfo = 18;
  string ex = 19;
  int64 sendTime = 20;
  int64 createTime = 21;
  int32 status = 22;
  string pinUserID = 23;
  int64 pinTime = 24;
}

// OnGroupMessagePinned()
// type: 1=置顶，2=取消置顶
message GroupMessagePinnedTips {
  GroupMemberFullInfo opUser = 1;
  GroupInfo group = 2;
  int32 type = 3;
  GroupPinnedMsgInfo pinnedMsg = 4;
  repeated GroupPinnedMsgInfo pinnedList = 5;
  // defaultTips English display text for the group notification message, e.g. "Alice pinned a text message"
  string defaultTips = 6;
}

// OnGroupCallStarted()
// mediaType: "audio" | "video" | "audio_video"
message GroupCallStartedTips {
  GroupMemberFullInfo opUser = 1;
  GroupInfo group = 2;
  // mediaType indicates the call type: "audio", "video", or "audio_video"
  string mediaType = 3;
  // defaultTips English display text, e.g. "Alice started an audio/video call"
  string defaultTips = 4;
}

// OnGroupBurnDurationSet()
// durationSecs: message disappear duration in seconds set by admin; 0 means turned off
message GroupBurnDurationSetTips {
  GroupMemberFullInfo opUser = 1;
  GroupInfo group = 2;
  // durationSecs is the new disappearing-message lifetime in seconds (0 = off)
  int32 durationSecs = 3;
  // defaultTips English display text, e.g. "Alice set disappearing messages to 1 day"
  string defaultTips = 4;
}

// OnGroupCallEnded()
// mediaType: "audio" | "video" | "audio_video"
// durationSecs: call duration in seconds; 0 means the call was cancelled/not answered
message GroupCallEndedTips {
  GroupMemberFullInfo opUser = 1;
  GroupInfo group = 2;
  string mediaType = 3;
  // durationSecs is the call duration in seconds (0 if not answered)
  int64 durationSecs = 4;
  // defaultTips English display text, e.g. "Alice ended an audio/video call (10 minutes 30 seconds)"
  string defaultTips = 5;
}

//	OnJoinGroupApplication()
message JoinGroupApplicationTips {
  GroupInfo group = 1;
  PublicUserInfo applicant = 2;
  string reqMsg = 3;
  string uuid = 4;
  GroupRequest request = 5;
}

//	OnQuitGroup()
//Actively leave the group
message MemberQuitTips {
  GroupInfo group = 1;
  GroupMemberFullInfo quitUser = 2;
  int64 operationTime = 3;
  uint64 groupMemberVersion = 4;
  string groupMemberVersionID = 5;
}

//	OnApplicationGroupAccepted()
message GroupApplicationAcceptedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  string handleMsg = 4;
  int32 receiverAs = 5; // admin(==1) or applicant(==0)
  string uuid = 6;
  GroupRequest request = 7;
}

//	OnApplicationGroupRejected()
message GroupApplicationRejectedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  string handleMsg = 4;
  int32 receiverAs = 5; // admin(==1) or applicant(==0)
  string uuid = 6;
  GroupRequest request = 7;
}

//	OnTransferGroupOwner()
message GroupOwnerTransferredTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  GroupMemberFullInfo newGroupOwner = 3;
  string oldGroupOwner = 4;
  int64 operationTime = 5;
  GroupMemberFullInfo oldGroupOwnerInfo = 6;
  uint64 groupMemberVersion = 7;
  string groupMemberVersionID = 8;
}

//	OnMemberKicked()
message MemberKickedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  repeated GroupMemberFullInfo kickedUserList = 3;
  int64 operationTime = 4;
  uint64 groupMemberVersion = 5;
  string groupMemberVersionID = 6;
}

//	OnMemberInvited()
message MemberInvitedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  repeated GroupMemberFullInfo invitedUserList = 3;
  int64 operationTime = 4;
  uint64 groupMemberVersion = 5;
  string groupMemberVersionID = 6;
  GroupMemberFullInfo inviterUser = 7;
  // defaultTips English display text, e.g. "Alice invited Bob to join the group"
  string defaultTips = 8;
}

//Actively join the group
message MemberEnterTips {
  GroupInfo group = 1;
  GroupMemberFullInfo entrantUser = 2;
  int64 operationTime = 3;
  uint64 groupMemberVersion = 5;
  string groupMemberVersionID = 6;
  // joinSource: 1=admin 2=invitation 3=search 4=qrcode 5=invite_link
  int32 joinSource = 7;
  // defaultTips English display text, e.g. "Alice joined the group via invite link"
  string defaultTips = 8;
}

message GroupDismissedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
}

message GroupMemberMutedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
  GroupMemberFullInfo mutedUser = 4;
  uint32 mutedSeconds = 5;
  uint64 groupMemberVersion = 6;
  string groupMemberVersionID = 7;
}

message GroupMemberCancelMutedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
  GroupMemberFullInfo mutedUser = 4;
  uint64 groupMemberVersion = 5;
  string groupMemberVersionID = 6;
}

message GroupMutedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
  uint64 groupMemberVersion = 4;
  string groupMemberVersionID = 5;
  // defaultTips English display text, e.g. "Alice muted all members"
  string defaultTips = 6;
}

message GroupCancelMutedTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
  uint64 groupMemberVersion = 4;
  string groupMemberVersionID = 5;
  // defaultTips English display text, e.g. "Alice unmuted all members"
  string defaultTips = 6;
}

message GroupMemberInfoSetTips {
  GroupInfo group = 1;
  GroupMemberFullInfo opUser = 2;
  int64 operationTime = 3;
  GroupMemberFullInfo changedUser = 4;
  uint64 groupMemberVersion = 5;
  string groupMemberVersionID = 6;
  uint64 groupSortVersion = 7;
}

//////////////////////friend/////////////////////

message FriendApplication {
  int64 addTime = 1;
  string addSource = 2;
  string addWording = 3;
}

message FromToUserID {
  string fromUserID = 1;
  string toUserID = 2;
}

//FromUserID apply to add ToUserID
message FriendApplicationTips {
  FromToUserID fromToUserID = 1; //from: initiator; to: receiver
  FriendRequest request = 2;
}

//FromUserID accept or reject ToUserID
message FriendApplicationApprovedTips {
  FromToUserID fromToUserID = 1; //from: the person who agrees; to: the person who initiates the request
  string handleMsg = 2;
  uint64 friendVersion = 3;
  string friendVersionID = 4;
  FriendRequest request = 5;
}

//FromUserID accept or reject ToUserID
message FriendApplicationRejectedTips {
  FromToUserID fromToUserID = 1; //from: rejecter; to: request initiator
  string handleMsg = 2;
  FriendRequest request = 3;
}

// FromUserID  Added a friend ToUserID
message FriendAddedTips {
  FriendInfo friend = 1;
  int64 operationTime = 2;
  PublicUserInfo opUser = 3; //who do this
  uint64 friendVersion = 4;
  string friendVersionID = 5;
}

// FromUserID  deleted a friend ToUserID
message FriendDeletedTips {
  FromToUserID fromToUserID = 1; //from：owner； to：friend
  uint64 friendVersion = 2;
  string friendVersionID = 3;
}

message BlackAddedTips {
  FromToUserID fromToUserID = 1; //from：owner； to：black
}

message BlackDeletedTips {
  FromToUserID fromToUserID = 1; //from：owner； to：black
}

message FriendInfoChangedTips {
  FromToUserID fromToUserID = 1; //from：changed； to：friend
  uint64 friendVersion = 2;
  string friendVersionID = 3;
  uint64 friendSortVersion = 4;
}

//////////////////////user/////////////////////
message UserInfoUpdatedTips {
  string userID = 1;
}

message UserStatusChangeTips {
  string fromUserID = 1;
  string toUserID = 2;
  int32 status = 3;
  int32 platformID = 4;
}
message UserCommandAddTips {
  string fromUserID = 1;
  string toUserID = 2;
}
message UserCommandUpdateTips {
  string fromUserID = 1;
  string toUserID = 2;
}
message UserCommandDeleteTips {
  string fromUserID = 1;
  string toUserID = 2;
}

//////////////////////conversation/////////////////////
message ConversationUpdateTips {
  string userID = 1;
  repeated string conversationIDList = 2;
}

message ConversationSetPrivateTips {
  string recvID = 1;
  string sendID = 2;
  bool isPrivate = 3;
  string conversationID = 4;
}

message ConversationHasReadTips {
  string userID = 1;
  string conversationID = 2;
  int64 hasReadSeq = 3;
  int64 unreadCountTime = 4;
}

message NotificationElem {
  string detail = 1;
}

////////////////////message///////////////////////
message seqs {
  repeated int64 seqs = 1;
}

message DeleteMessageTips {
  string opUserID = 1;
  string userID = 2;
  repeated int64 seqs = 3;
}

message RevokeMsgTips {
  string revokerUserID = 1;
  string clientMsgID = 2;
  int64 revokeTime = 3;
  int32 sesstionType = 5;
  int64 seq = 6;
  string conversationID = 7;
  bool isAdminRevoke = 8;
}

message MessageRevokedContent {
  string revokerID = 1;
  int32 revokerRole = 2;
  string clientMsgID = 3;
  string revokerNickname = 4;
  int64 revokeTime = 5;
  int64 sourceMessageSendTime = 6;
  string sourceMessageSendID = 7;
  string sourceMessageSenderNickname = 8;
  int32 sessionType = 10;
  int64 seq = 11;
  string ex = 12;
}

message ClearConversationTips {
  string userID = 1;
  repeated string conversationIDs = 2;
}

message DeleteMsgsTips {
  string userID = 1;
  string conversationID = 2;
  repeated int64 seqs = 3;
}

message MarkAsReadTips {
  string markAsReadUserID = 1;
  string conversationID = 2;
  repeated int64 seqs = 3;
  int64 hasReadSeq = 4;
}

message SetAppBackgroundStatusReq {
  string userID = 1;
  bool isBackground = 2;
}

message SetAppBackgroundStatusResp {}
message ProcessUserCommand {
  string userID = 1;
  int32 type = 2;
  int64 createTime = 3;
  string uuid = 4;
  string value = 5;
}

message RequestPagination {
  int32 pageNumber = 1;
  int32 showNumber = 2;
}
message FriendsInfoUpdateTips {
  FromToUserID fromToUserID = 1;
  repeated string friendIDs = 2;
  uint64 friendVersion = 3;
  string friendVersionID = 4;
  uint64 friendSortVersion = 5;
}

message SubUserOnlineStatusElem {
  string userID = 1;
  repeated int32 onlinePlatformIDs = 2;
}

message SubUserOnlineStatusTips {
  repeated SubUserOnlineStatusElem subscribers = 1;
}

message SubUserOnlineStatus {
  repeated string subscribeUserID = 1;
  repeated string unsubscribeUserID = 2;
}

message StreamMsgTips {
  string conversationID = 1;
  string clientMsgID = 2;
  int64 startIndex = 3;
  repeated string packets = 4;
  bool end = 5;
}

message ConversationDeleteTips {
  string userID = 1;
  repeated string conversationIDs = 2;
}
