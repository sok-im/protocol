syntax = "proto3";
package openim.user;

import "conversation/conversation.proto";
import "sdkws/sdkws.proto";
import "wrapperspb/wrapperspb.proto";

option go_package = "github.com/openimsdk/protocol/user";

message getAllUserIDReq {
  sdkws.RequestPagination pagination = 1;
}
message getAllUserIDResp {
  int32 total = 1;
  repeated string userIDs = 2;
}

message accountCheckReq {
  repeated string checkUserIDs = 1;
}
message accountCheckResp {
  message singleUserStatus {
    string userID = 1;
    int32 accountStatus = 2;
  }
  repeated singleUserStatus results = 1;
}

message getDesignateUsersReq {
  repeated string userIDs = 1;
}
message getDesignateUsersResp {
  repeated sdkws.UserInfo usersInfo = 1;
}

message updateUserInfoReq {
  sdkws.UserInfo userInfo = 1;
}
message updateUserInfoResp {}
message updateUserInfoExReq {
  sdkws.UserInfoWithEx userInfo = 1;
}
message updateUserInfoExResp {}
message setGlobalRecvMessageOptReq {
  string userID = 1;
  int32 globalRecvMsgOpt = 3;
}

message setGlobalRecvMessageOptResp {}

message setConversationReq {
  openim.conversation.Conversation conversation = 1;
  int32 notificationType = 2;
  string operationID = 3;
}

message setConversationResp {}

message setRecvMsgOptReq {
  string ownerUserID = 1;
  string conversationID = 2;
  int32 recvMsgOpt = 3;
  int32 notificationType = 4;
  string operationID = 5;
}

message setRecvMsgOptResp {}

message getConversationReq {
  string conversationID = 1;
  string ownerUserID = 2;
  string operationID = 3;
}

message getConversationResp {
  openim.conversation.Conversation conversation = 2;
}

message getConversationsReq {
  string ownerUserID = 1;
  repeated string conversationIDs = 2;
  string operationID = 3;
}

message getConversationsResp {
  repeated openim.conversation.Conversation conversations = 2;
}

message getAllConversationsReq {
  string ownerUserID = 1;
  string operationID = 2;
}

message getAllConversationsResp {
  repeated openim.conversation.Conversation conversations = 2;
}

message batchSetConversationsReq {
  repeated openim.conversation.Conversation conversations = 1;
  string OwnerUserID = 2;
  int32 notificationType = 3;
  string OperationID = 4;
}

message batchSetConversationsResp {
  repeated string Success = 2;
  repeated string Failed = 3;
}

message getPaginationUsersReq {
  sdkws.RequestPagination pagination = 2;
  string userID = 3;
  string nickName = 4;
}

message getPaginationUsersResp {
  int32 total = 1;
  repeated sdkws.UserInfo users = 2;
}

message userRegisterReq {
  repeated sdkws.UserInfo users = 1;
}
message userRegisterResp {}

message getGlobalRecvMessageOptReq {
  string userID = 1;
}

message getGlobalRecvMessageOptResp {
  int32 globalRecvMsgOpt = 1;
}

message userRegisterCountReq {
  int64 start = 1;
  int64 end = 2;
}

message userRegisterCountResp {
  int64 total = 1;
  int64 before = 2;
  map<string, int64> count = 3;
}

message getOnlineUserCountReq {
  string areaCode = 1;
}

message onlineUserAreaCount {
  string areaCode = 1;
  int64 onlineUserCount = 2;
}

message getOnlineUserCountResp {
  int64 onlineUserCount = 1;
  string areaCode = 2;
  repeated onlineUserAreaCount areaCounts = 3;
}

message subscribeOrCancelUsersStatusReq {
  string userID = 1;
  repeated string userIDs = 2;
  int32 genre = 3;
}

message subscribeOrCancelUsersStatusResp {
  repeated onlineStatus statusList = 1;
}

message getSubscribeUsersStatusReq {
  string userID = 1;
}

message getSubscribeUsersStatusResp {
  repeated onlineStatus statusList = 1;
}

message onlineStatus {
  string userID = 1;
  int32 status = 2;
  repeated int32 platformIDs = 3;
}

message getUserStatusReq {
  string userID = 1;
  repeated string userIDs = 2;
}

message getUserStatusResp {
  repeated onlineStatus statusList = 1;
}

message setUserStatusReq {
  string userID = 1;
  int32 status = 2;
  int32 platformID = 3;
  string connID = 4;
  bool isBackground = 5;
}

message setUserStatusResp {}

message userOnlineStatus {
  string userID = 1;
  string connID = 2;
  repeated int32 online = 3;
  repeated int32 offline = 4;
}

message setUserOnlineStatusReq {
  repeated userOnlineStatus status = 1;
}

message setUserOnlineStatusResp {}

message processUserCommandAddReq {
  string userID = 1;
  int32 type = 2;
  string uuid = 3;
  openim.protobuf.StringValue value = 4;
  openim.protobuf.StringValue ex = 5;
}

message processUserCommandAddResp {}

message processUserCommandDeleteReq {
  string userID = 1;
  int32 type = 2;
  string uuid = 3;
}

message processUserCommandDeleteResp {}

message processUserCommandUpdateReq {
  string userID = 1;
  int32 type = 2;
  string uuid = 3;
  openim.protobuf.StringValue value = 4;
  openim.protobuf.StringValue ex = 5;
}

message processUserCommandUpdateResp {}

message processUserCommandGetReq {
  string userID = 1;
  int32 type = 2;
}

message CommandInfoResp {
  int32 type = 1;
  int64 createTime = 2;
  string uuid = 3;
  string value = 4;
  string ex = 5;
}

message processUserCommandGetResp {
  repeated CommandInfoResp CommandResp = 1;
}
message processUserCommandGetAllReq {
  string userID = 1;
}

message AllCommandInfoResp {
  int32 type = 1;
  int64 createTime = 2;
  string uuid = 3;
  string value = 4;
  string ex = 5;
}

message processUserCommandGetAllResp {
  repeated AllCommandInfoResp CommandResp = 1;
}
message addNotificationAccountReq {
  string userID = 1;
  string nickName = 2;
  string faceURL = 3;
  int32 appMangerLevel = 4;
}

message addNotificationAccountResp {
  string userID = 1;
  string faceURL = 2;
  string nickName = 3;
  int32 appMangerLevel = 4;
}

message updateNotificationAccountInfoReq {
  string userID = 1;
  string faceURL = 2;
  string nickName = 3;
}

message updateNotificationAccountInfoResp {}

message searchNotificationAccountReq {
  string keyword = 1;
  optional int32 appManagerLevel = 2;
  sdkws.RequestPagination pagination = 3;
}

message notificationAccountInfo {
  string userID = 1;
  string faceURL = 2;
  string nickName = 3;
  int32 appMangerLevel = 4;
}

message searchNotificationAccountResp {
  int64 total = 1;
  repeated notificationAccountInfo notificationAccounts = 2;
}

message getNotificationAccountReq {
  string userID = 1;
}

message getNotificationAccountResp {
    notificationAccountInfo account = 1;
}

message sortQueryReq {
  bool asc = 1;
  map<string, string> userIDName = 2;
}

message sortQueryResp {
  repeated sdkws.UserInfo users = 2;
}

message getAllOnlineUsersReq {
  uint64 cursor = 1;
}

message getAllOnlineUsersResp {
  repeated onlineStatus StatusList = 1;
  uint64 nextCursor = 2;
}

message getUserClientConfigReq {
  string userID = 1;
}

message getUserClientConfigResp {
  map<string,string> configs = 2;
}

message setUserClientConfigReq {
  string userID = 1;
  map<string,string> configs = 2;
}

message setUserClientConfigResp {
}

message delUserClientConfigReq {
  string userID = 1;
  repeated string keys = 2;
}

message delUserClientConfigResp {
}


message pageUserClientConfigReq {
  string userID = 1;
  string key = 2;
  sdkws.RequestPagination pagination = 3;
}

message pageUserClientConfigResp {
  int64 total = 1;
  repeated clientConfig configs = 2;
}

message clientConfig {
  string key = 1;
  string userID = 2;
  string value = 3;
}

message setPhoneVisibilityReq {
  string userID = 1;
  string phone = 2;
  // phoneVisibility 0=所有人 1=仅好友 2=隐藏
  int32 phoneVisibility = 3;
}
message setPhoneVisibilityResp {}

message setCallAcceptSettingReq {
  string userID = 1;
  // callAcceptSetting 0=所有人可发起 1=仅好友可发起 2=不接受任何通话
  int32 callAcceptSetting = 2;
}
message setCallAcceptSettingResp {}

message setCallRingtoneReq {
  string userID = 1;
  // callRingtoneURL 用户自定义来电铃声 URL；空字符串表示清除，使用客户端默认铃声
  string callRingtoneURL = 2;
  // callRingtoneName 用户自定义来电铃声名称；空字符串表示清除
  string callRingtoneName = 3;
  // callRingtoneCover 用户自定义来电铃声封面 URL；空字符串表示清除
  string callRingtoneCover = 4;
  // callRingtoneAuthor 用户自定义来电铃声作者；空字符串表示清除
  string callRingtoneAuthor = 5;
}
message setCallRingtoneResp {}

message setMsgReceiveSettingReq {
  string userID = 1;
  // msgReceiveSetting 0=所有人可发送 1=仅好友可发送 2=所有人不可发送
  int32 msgReceiveSetting = 2;
}
message setMsgReceiveSettingResp {}

message setGroupInviteSettingReq {
  string userID = 1;
  // groupInviteSetting 0=所有人可邀请 1=仅好友可邀请 2=所有人不可邀请
  int32 groupInviteSetting = 2;
}
message setGroupInviteSettingResp {}

message getUserByPhoneReq {
  // phone 精确手机号，纯数字 5-20 位，可选 + 前缀（如 13800138000 或 +8613800138000）
  string phone = 1;
}
message getUserByPhoneResp {
  sdkws.UserInfo userInfo = 1;
}

message getUsersByNicknameReq {
  string nickname = 1;
}
message getUsersByNicknameResp {
  repeated sdkws.UserInfo usersInfo = 1;
}

message checkNicknameReq {
  string nickname = 1;
  // excludeUserID 修改昵称时传入当前用户 ID，排除本人占用
  string excludeUserID = 2;
}
message checkNicknameResp {
  bool exists = 1;
}

message checkUserExistReq {
  string userID = 1;
}
message checkUserExistResp {
  bool exists = 1;
}

message setUserMsgBurnDurationReq {
  string userID = 1;
  // msgBurnDuration 阅后即焚时长，单位秒；0 表示关闭，必须 >= 0
  int32 msgBurnDuration = 2;
}
message setUserMsgBurnDurationResp {}

message setDeleteAccountIntervalReq {
  string userID = 1;
  // deleteAccountInterval 删除账号等待间隔（秒）；0 表示使用系统默认（18个月）；必须 >= 0
  int32 deleteAccountInterval = 2;
}
message setDeleteAccountIntervalResp {}

message setMsgNotificationSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setMsgNotificationSwitchResp {}

message setSokimPaymentNotificationSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setSokimPaymentNotificationSwitchResp {}

message setSokimServiceNotificationSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setSokimServiceNotificationSwitchResp {}

message setAvNotificationSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setAvNotificationSwitchResp {}

message setAvCallRingtoneSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setAvCallRingtoneSwitchResp {}

message setPlayCalleeRingtoneOnAnswerSwitchReq {
  string userID = 1;
  // enable true=打开 false=关闭
  bool enable = 2;
}
message setPlayCalleeRingtoneOnAnswerSwitchResp {}

message getUserNotificationSettingsReq {}
message getUserNotificationSettingsResp {
  // msgNotification 消息通知开关
  bool msgNotification = 1;
  // sokimPaymentNotification sokim 支付通知开关
  bool sokimPaymentNotification = 2;
  // sokimServiceNotification sokim 服务通知开关
  bool sokimServiceNotification = 3;
  // avNotification 音视频通知开关
  bool avNotification = 4;
  // avCallRingtone 音视频来电铃声开关
  bool avCallRingtone = 5;
  // playCalleeRingtoneOnAnswer 接听时播放对方铃声开关
  bool playCalleeRingtoneOnAnswer = 6;
}

message getUserPrivacySettingsReq {}
message getUserPrivacySettingsResp {
  // msgBurnDuration 阅后即焚时长（秒），0 表示关闭
  int32 msgBurnDuration = 1;
  // phoneVisibility 手机号可见性：0=所有人 1=仅好友 2=隐藏
  int32 phoneVisibility = 2;
  // callAcceptSetting 音视频通话接受：0=所有人可发起 1=仅好友可发起 2=不接受任何通话
  int32 callAcceptSetting = 3;
  // globalRecvMsgOpt 全局消息接收选项（OpenIM 默认 recvMsgOpt）
  int32 globalRecvMsgOpt = 4;
  // msgReceiveSetting 会话消息接收权限：0=所有人可发送 1=仅好友可发送 2=所有人不可发送
  int32 msgReceiveSetting = 5;
  // groupInviteSetting 群邀请权限：0=所有人可邀请 1=仅好友可邀请 2=所有人不可邀请
  int32 groupInviteSetting = 6;
  // deleteAccountInterval 删除账号等待间隔（秒）；0 表示使用系统默认（18个月）
  int32 deleteAccountInterval = 7;
}


service user {
  //Get the specified user information full field
  rpc getDesignateUsers(getDesignateUsersReq) returns (getDesignateUsersResp);
  //update user information
  rpc updateUserInfo(updateUserInfoReq) returns (updateUserInfoResp);
  rpc updateUserInfoEx(updateUserInfoExReq) returns (updateUserInfoExResp);
  //Set user message receiving options
  rpc setGlobalRecvMessageOpt(setGlobalRecvMessageOptReq) returns (setGlobalRecvMessageOptResp);
  //Get the user message receiving option If not found, no error will be returned
  rpc getGlobalRecvMessageOpt(getGlobalRecvMessageOptReq) returns (getGlobalRecvMessageOptResp);
  //Check if userID exists
  rpc accountCheck(accountCheckReq) returns (accountCheckResp);
  //Turn the page (or specify userID, nickname) to pull user information Full field
  rpc getPaginationUsers(getPaginationUsersReq) returns (getPaginationUsersResp);
  //user registration
  rpc userRegister(userRegisterReq) returns (userRegisterResp);
  //Get all user IDs
  rpc getAllUserID(getAllUserIDReq) returns (getAllUserIDResp);
  //Get the total number of users and the user increment within a specified time period
  rpc userRegisterCount(userRegisterCountReq) returns (userRegisterCountResp);
  //Get current online user count, optionally filtered by areaCode
  rpc getOnlineUserCount(getOnlineUserCountReq) returns (getOnlineUserCountResp);
  //Subscribe or unsubscribe user presence
  rpc subscribeOrCancelUsersStatus(subscribeOrCancelUsersStatusReq) returns (subscribeOrCancelUsersStatusResp);
  //Get the online status of subscribers
  rpc getSubscribeUsersStatus(getSubscribeUsersStatusReq) returns (getSubscribeUsersStatusResp);
  //Get user online status
  rpc getUserStatus(getUserStatusReq) returns (getUserStatusResp);
  //The gateway synchronizes the online status of users in redis
  rpc setUserStatus(setUserStatusReq) returns (setUserStatusResp);
  //add a general function for add
  rpc processUserCommandAdd(processUserCommandAddReq) returns (processUserCommandAddResp);
  //add a general function for update
  rpc processUserCommandUpdate(processUserCommandUpdateReq) returns (processUserCommandUpdateResp);
  //add a general function for delete
  rpc processUserCommandDelete(processUserCommandDeleteReq) returns (processUserCommandDeleteResp);
  //add a general function for get
  rpc processUserCommandGet(processUserCommandGetReq) returns (processUserCommandGetResp);
  //add a general function for get all
  rpc processUserCommandGetAll(processUserCommandGetAllReq) returns (processUserCommandGetAllResp);
  //add a system notification account
  rpc addNotificationAccount(addNotificationAccountReq) returns (addNotificationAccountResp);
  //update the system notification info
  rpc updateNotificationAccountInfo(updateNotificationAccountInfoReq) returns (updateNotificationAccountInfoResp);
  //search the system notification account
  rpc searchNotificationAccount(searchNotificationAccountReq) returns (searchNotificationAccountResp);
  //getNotificationAccount by userID
  rpc getNotificationAccount(getNotificationAccountReq) returns (getNotificationAccountResp);

  rpc sortQuery(sortQueryReq) returns (sortQueryResp);

  rpc setUserOnlineStatus(setUserOnlineStatusReq) returns (setUserOnlineStatusResp);
  // get all online users
  rpc getAllOnlineUsers(getAllOnlineUsersReq) returns (getAllOnlineUsersResp);

  rpc getUserClientConfig(getUserClientConfigReq) returns (getUserClientConfigResp);

  rpc setUserClientConfig(setUserClientConfigReq) returns (setUserClientConfigResp);

  rpc delUserClientConfig(delUserClientConfigReq) returns (delUserClientConfigResp);

  rpc pageUserClientConfig(pageUserClientConfigReq) returns (pageUserClientConfigResp);

  // 设置手机号及其可见性（所有人/仅好友/隐藏）
  rpc setPhoneVisibility(setPhoneVisibilityReq) returns (setPhoneVisibilityResp);

  // 设置音视频通话接受权限（所有人/仅好友/不接受）
  rpc setCallAcceptSetting(setCallAcceptSettingReq) returns (setCallAcceptSettingResp);

  // 设置会话消息接收权限（所有人/仅好友/所有人不可发送）
  rpc setMsgReceiveSetting(setMsgReceiveSettingReq) returns (setMsgReceiveSettingResp);

  // 设置群邀请权限（所有人/仅好友/所有人不可邀请）
  rpc setGroupInviteSetting(setGroupInviteSettingReq) returns (setGroupInviteSettingResp);

  // 根据手机号精确查询用户，自动尊重 phone_visibility 设置
  rpc getUserByPhone(getUserByPhoneReq) returns (getUserByPhoneResp);

  // 根据用户昵称精确查询普通用户（可多结果，与 getPaginationUsers 模糊搜索不同）
  rpc getUsersByNickname(getUsersByNicknameReq) returns (getUsersByNicknameResp);

  // 检查昵称是否已被普通用户占用（精确匹配）
  rpc checkNickname(checkNicknameReq) returns (checkNicknameResp);

  // 检查指定 userID 的用户是否存在
  rpc checkUserExist(checkUserExistReq) returns (checkUserExistResp);

  // 设置用户全局消息阅后即焚时长（秒），0 表示关闭
  rpc setUserMsgBurnDuration(setUserMsgBurnDurationReq) returns (setUserMsgBurnDurationResp);

  // 设置删除账号等待间隔（秒），0 表示使用系统默认（18个月）
  rpc setDeleteAccountInterval(setDeleteAccountIntervalReq) returns (setDeleteAccountIntervalResp);

  // 返回当前登录用户的隐私与接收相关设置（阅后即焚、手机号可见性、音视频、全局消息接收、会话消息接收、群邀请）；userID 取自上下文 opUserID
  rpc getUserPrivacySettings(getUserPrivacySettingsReq) returns (getUserPrivacySettingsResp);

  // 设置消息通知开关
  rpc setMsgNotificationSwitch(setMsgNotificationSwitchReq) returns (setMsgNotificationSwitchResp);
  // 设置 sokim 支付通知开关
  rpc setSokimPaymentNotificationSwitch(setSokimPaymentNotificationSwitchReq) returns (setSokimPaymentNotificationSwitchResp);
  // 设置 sokim 服务通知开关
  rpc setSokimServiceNotificationSwitch(setSokimServiceNotificationSwitchReq) returns (setSokimServiceNotificationSwitchResp);
  // 设置音视频通知开关
  rpc setAvNotificationSwitch(setAvNotificationSwitchReq) returns (setAvNotificationSwitchResp);
  // 设置音视频来电铃声开关
  rpc setAvCallRingtoneSwitch(setAvCallRingtoneSwitchReq) returns (setAvCallRingtoneSwitchResp);
  // 设置接听时播放对方铃声开关
  rpc setPlayCalleeRingtoneOnAnswerSwitch(setPlayCalleeRingtoneOnAnswerSwitchReq) returns (setPlayCalleeRingtoneOnAnswerSwitchResp);
  // 返回当前登录用户的通知相关开关；userID 取自上下文 opUserID
  rpc getUserNotificationSettings(getUserNotificationSettingsReq) returns (getUserNotificationSettingsResp);

}
