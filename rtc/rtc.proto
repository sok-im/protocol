syntax = "proto3";
package openim.rtc;
import "sdkws/sdkws.proto";
option go_package = "github.com/openimsdk/protocol/rtc";

message ParticipantMetaData{
  openim.sdkws.GroupInfo groupInfo = 1;
  openim.sdkws.GroupMemberFullInfo groupMemberInfo = 2;
  openim.sdkws.PublicUserInfo userInfo = 3;
}

message GetJoinTokenReq{
  string room = 1;
  string identity = 2;
  ParticipantMetaData metaData = 3;
}

message GetJoinTokenResp{
  string jwt = 1;
  string liveURL = 2;
}


message SignalReq {
  oneof payload {
    SignalInviteReq invite = 1;
    SignalInviteInGroupReq inviteInGroup= 2;
    SignalCancelReq cancel = 3;
    SignalAcceptReq accept = 4;
    SignalHungUpReq hungUp = 5;
    SignalRejectReq reject = 6;
    SignalGetTokenByRoomIDReq getTokenByRoomID = 7;
    SignalTimeoutReq timeout = 8;
  }
}

message SignalSendCustomSignalReq {
  string roomID = 1;
  string customInfo = 2;
}

message SignalSendCustomSignalResp {
}

message SignalOnStreamChangeReq {
  string roomID = 1;
  string streamType = 2;
  bool mute = 3;
}

message SignalResp {
  oneof payload {
    SignalInviteResp invite = 1;
    SignalInviteInGroupResp inviteInGroup= 2;
    SignalCancelResp cancel = 3;
    SignalAcceptResp accept = 4;
    SignalHungUpResp hungUp = 5;
    SignalRejectResp reject = 6;
    SignalGetTokenByRoomIDResp getTokenByRoomID = 7;
    SignalTimeoutResp timeout = 8;
  }
}

message InvitationInfo  {
  string inviterUserID = 1;
  repeated string inviteeUserIDList = 2;
  string customData = 3;
  string  groupID = 4;
  string roomID = 5;
  int32 timeout = 6;
  string mediaType = 7;
  int32 platformID = 8;
  int32 sessionType = 9;
  int64 initiateTime = 10;
  repeated string busyLineUserIDList = 11;
  // callerRingtoneURL 主叫方的来电铃声 URL；服务端从主叫用户资料填充，被叫客户端用于播放铃声
  string callerRingtoneURL = 12;
  // notAllowUserIDList 因通话接听设置不允许被邀请的用户 ID 列表
  repeated string notAllowUserIDList = 13;
}

message SignalInviteReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  ParticipantMetaData participant = 3;
  string userID = 4;
}

message SignalInviteResp {
  string token = 1;
  string roomID = 2;
  string liveURL = 3;
  repeated string busyLineUserIDList = 4;
  // calleeRingtoneURL 被叫方设置的来电铃声 URL；主叫方在等待接听时播放此铃声
  string calleeRingtoneURL = 5;
  // notAllowUserIDList 因通话接听设置不允许被邀请的用户 ID 列表
  repeated string notAllowUserIDList = 6;
}

message SignalInviteInGroupReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  ParticipantMetaData participant = 3;
  string userID = 4;
}

message SignalInviteInGroupResp {
  string token = 1;
  string roomID = 2;
  string liveURL = 3;
  repeated string busyLineUserIDList = 4;
  // calleeRingtoneURL 被叫方设置的来电铃声 URL（1v1 时为对方铃声，群聊时取第一位被叫）
  string calleeRingtoneURL = 5;
  // notAllowUserIDList 因通话接听设置不允许被邀请的用户 ID 列表
  repeated string notAllowUserIDList = 6;
}

message SignalCancelReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  ParticipantMetaData participant = 3;
  string userID = 4;
}

message SignalCancelResp {

}

message SignalAcceptReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  ParticipantMetaData participant = 3;
  int32 opUserPlatformID = 4;
  string userID = 5;
}

message SignalAcceptResp {
  string token = 1;
  string roomID = 2;
  string liveURL = 3;
}

message SignalHungUpReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  string userID = 3;
  // callDuration: 1v1 talk duration in seconds reported by the client; 0 = server computes from AcceptTime
  int64 callDuration = 4;
}

message SignalHungUpResp {

}


message SignalRejectReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo  = 2;
  ParticipantMetaData participant = 3;
  int32 opUserPlatformID = 4;
  string userID = 5;
}

message SignalRejectResp {

}

// SignalTimeoutReq is sent by the inviter when no invitee answers within Timeout seconds.
// Server notifies invitees (missed-call UI), deletes the invitation, and writes a call record.
message SignalTimeoutReq {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo = 2;
  string userID = 3;
}

message SignalTimeoutResp {}

message SignalGetRoomByGroupIDReq {
  string groupID = 1;
}

message SignalGetRoomByGroupIDResp {
  InvitationInfo invitation = 1;
  // participant 当前已连接 LiveKit 房间的用户（正在通话中的成员）；仅含 userInfo 等元数据。
  repeated ParticipantMetaData participant = 2;
  string roomID = 3;
  // inCall 为 true 表示房间内至少有一名用户已接通（LiveKit 侧有 participant）。
  bool inCall = 4;
}

message SignalOnRoomParticipantConnectedReq {
  InvitationInfo invitation = 1;
  repeated ParticipantMetaData participant = 2;
  string groupID = 3;
}

message SignalOnRoomParticipantDisconnectedReq {
  InvitationInfo invitation = 1;
  repeated ParticipantMetaData participant = 2;
  string groupID = 3;
}

message SignalGetTokenByRoomIDReq {
  string roomID = 1;
  ParticipantMetaData participant = 2;
  string userID = 3;
}

message SignalGetTokenByRoomIDResp {
  string token = 1;
  string liveURL = 2;
}

message SignalMessageAssembleReq {
  SignalReq signalReq = 1;
}

message SignalMessageAssembleResp {
  SignalResp signalResp = 1;
}

message SignalGetRoomsReq {
  repeated string roomIDs = 1;
}

message SignalGetRoomsResp {
  repeated SignalGetRoomByGroupIDResp roomList = 1;
}


message GetSignalInvitationInfoReq {
  string roomID = 1;
}

message GetSignalInvitationInfoResp {
  InvitationInfo invitationInfo = 1;
  sdkws.OfflinePushInfo offlinePushInfo = 2;
}

message GetSignalInvitationInfoStartAppReq {
  string userID = 1;
}

message GetSignalInvitationInfoStartAppResp {
  InvitationInfo invitation = 1;
  sdkws.OfflinePushInfo offlinePushInfo = 2;
}

message SignalUser {
  string userID = 1;
  string nickname = 2;
  int32 status = 3;
}

message SignalRecord {
  string roomID = 1;
  string sID = 2;
  string fileName = 3;
  string mediaType = 4;
  int32 sessionType = 5;
  string inviterUserID = 6;
  string inviterUserNickname = 7;
  string groupID = 8;
  string groupName = 9;
  repeated SignalUser inviterUsers = 10;
  int64 createTime = 11;
  int64 endTime = 12;
  string size = 13;
  string fileURL = 14;
}

message FileRecord {
  string size = 1;
  string fileURL = 2;
}

message GetSignalInvitationRecordsReq {
  sdkws.RequestPagination pagination = 1;
  int32 sessionType = 2;
  string sendID = 3;
  string recvID = 4;
  int64 startTime = 5;
  int64 endTime = 6;
  repeated sdkws.UserInfo JoinedUsers = 7;
}

message GetSignalInvitationRecordsResp {
  int32 total = 1;
  repeated SignalRecord signalRecords = 2;
}

message DeleteSignalRecordsReq {
  repeated string sIDs = 1;
}

message DeleteSignalRecordsResp {
}

// CallRecordItem represents one completed call event stored in the call_record table.
message CallRecordItem {
  string sid = 1;
  string roomID = 2;
  // status: 1=answered(已接听), 2=not_connected(未接通)
  int32 status = 3;
  int64 duration = 4;        // call duration in seconds; 0 if not connected
  int64 createTime = 5;      // Unix ms, when the call was initiated
  string mediaType = 6;
  int32 sessionType = 7;
  string inviterUserID = 8;
  string inviterUserNickname = 9;
  string inviterUserFaceURL = 10;
  repeated string inviteeUserIDList = 11;
  string groupID = 12;
  string groupName = 13;
  // direction: 1=outgoing(主叫), 2=incoming(被叫); computed per querying user
  int32 direction = 14;
  // role: 1=outgoing(主叫), 2=incoming(被叫); 与 direction 对齐的简化字段
  int32 role = 17;
  // dial_duration: 拨打时长（秒）= 发起→接通 for answered; 发起→结束 for not connected
  int64 dialDuration = 15;
  // call_duration: 通话时长（秒）= 接通→挂断 for answered; 0 for not connected
  int64 callDuration = 16;
}

message GetCallRecordsReq {
  string userID = 1;
  // status: 0=all, 1=answered, 2=not_connected
  int32 status = 2;
  int64 startTime = 3;
  int64 endTime = 4;
  sdkws.RequestPagination pagination = 5;
  // keyword: fuzzy match against InviterUserNickname (empty = no filter)
  string keyword = 6;
}

message GetCallRecordsResp {
  int32 total = 1;
  repeated CallRecordItem records = 2;
}

service RtcService {
  rpc SignalMessageAssemble(SignalMessageAssembleReq) returns(SignalMessageAssembleResp);
  rpc SignalGetRoomByGroupID(SignalGetRoomByGroupIDReq) returns(SignalGetRoomByGroupIDResp);
  rpc SignalGetTokenByRoomID(SignalGetTokenByRoomIDReq) returns(SignalGetTokenByRoomIDResp);
  rpc SignalGetRooms(SignalGetRoomsReq) returns(SignalGetRoomsResp);

  rpc GetSignalInvitationInfo(GetSignalInvitationInfoReq) returns(GetSignalInvitationInfoResp);
  rpc GetSignalInvitationInfoStartApp(GetSignalInvitationInfoStartAppReq) returns(GetSignalInvitationInfoStartAppResp);

  // custom signal
  rpc SignalSendCustomSignal(SignalSendCustomSignalReq) returns(SignalSendCustomSignalResp);

  // rtc cms
  rpc GetSignalInvitationRecords(GetSignalInvitationRecordsReq) returns(GetSignalInvitationRecordsResp);
  rpc DeleteSignalRecords(DeleteSignalRecordsReq) returns(DeleteSignalRecordsResp);

  // call record history
  rpc GetCallRecords(GetCallRecordsReq) returns(GetCallRecordsResp);
}
