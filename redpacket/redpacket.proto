syntax = "proto3";
package openim.redpacket;

option go_package = "github.com/openimsdk/protocol/redpacket";

// ─── Common record types ──────────────────────────────────────────────────────

message RedPacketRecord {
  string bizID            = 1;
  string chainType        = 2;
  string packetID         = 3;
  int64  chainID          = 4;
  string contractAddress  = 5;
  string creatorUserID    = 6;
  string creatorWallet    = 7;
  string groupID          = 8;
  string scopeType        = 9;
  string receiverUserID   = 10;
  repeated string receiverUserIDs = 11;
  int32  packetType       = 12;
  string token            = 13;
  string totalAmount      = 14;
  int32  totalShares      = 15;
  string claimedAmount    = 16;
  int32  claimedShares    = 17;
  int64  expiryAt         = 18;
  string txHash           = 19;
  string status           = 20;
  int64  createdAt        = 21;
  int64  updatedAt        = 22;
  string chainKey         = 23;
  string transactionType  = 24;
  int32  decimals             = 25;
  string totalAmountDisplay   = 26;
  string claimedAmountDisplay = 27;
  string remainingAmount          = 28;
  string remainingAmountDisplay   = 29;
  int32  remainingShares          = 30;
}

message RedPacketClaimRecord {
  string packetID      = 1;
  string userID        = 2;
  string claimerWallet = 3;
  string authNonce     = 4;
  string claimTxHash   = 5;
  string claimedAmount = 6;
  uint64 blockNumber   = 7;
  string status        = 8;
  int64  createdAt     = 9;
  int64  updatedAt     = 10;
  string claimedAmountDisplay = 11;
}

message ParsedEvent {
  string name = 1;
  map<string, string> data = 2;
}

// ─── Create order ─────────────────────────────────────────────────────────────

message CreateOrderReq {
  string chainType         = 1;
  int64  chainID           = 2;
  string contractAddress   = 3;
  string creatorWallet     = 4;
  string groupID           = 5;
  string scopeType         = 6;
  string receiverUserID    = 7;
  repeated string receiverUserIDs = 8;
  int32  packetType        = 9;
  string token             = 10;
  string totalAmount       = 11;
  int32  totalShares       = 12;
  int64  expiryAt          = 13;
  string remark            = 14;
  string chainKey          = 15;
  string transactionType   = 16;
}

message CreateOrderResp {
  string bizID = 1;
}

// ─── Created callback ─────────────────────────────────────────────────────────

message CreatedCallbackReq {
  string bizID            = 1;
  string txHash           = 2;
  string packetID         = 3;
  string groupID          = 4;
  string scopeType        = 5;
  string receiverUserID   = 6;
  repeated string receiverUserIDs = 7;
  string chainKey         = 8;
}

message CreatedCallbackResp {}

// ─── Detail ───────────────────────────────────────────────────────────────────

message GetDetailReq {
  string packetID  = 1;
  string chainType = 2;
  string chainKey  = 3;
}

message GetDetailResp {
  RedPacketRecord record = 1;
  repeated RedPacketClaimRecord claims = 2;
}

// ─── Claim sign / result ──────────────────────────────────────────────────────

message IssueClaimSignReq {
  string packetID   = 1;
  string claimer    = 2;
  string randomSeed = 3;
  string chainType  = 4;
  string chainKey   = 5;
}

message IssueClaimSignResp {
  string authNonce  = 1;
  int64  deadline   = 2;
  string signature  = 3;
  string randomSeed = 4;
}

message ClaimResultReq {
  string packetID  = 1;
  string claimer   = 2;
  string txHash    = 3;
  string chainType = 4;
  string chainKey  = 5;
}

message ClaimResultResp {}

// ─── Wallet binding ───────────────────────────────────────────────────────────

message IssueWalletBindChallengeReq {
  string chainType     = 1;
  int64  chainID       = 2;
  string walletAddress = 3;
  string domain        = 4;
  string uri           = 5;
  string chainKey      = 6;
}

message IssueWalletBindChallengeResp {
  string challengeID = 1;
  string userID      = 2;
  string chainType   = 3;
  int64  chainID     = 4;
  string wallet      = 5;
  string protocol    = 6;
  string signMethod  = 7;
  string nonce       = 8;
  string message     = 9;
  string issuedAt    = 10;
  string expiresAt   = 11;
  string chainKey    = 12;
}

message ConfirmWalletBindReq {
  string challengeID = 1;
  string signature   = 2;
}

message ConfirmWalletBindResp {
  string userID        = 1;
  string chainType     = 2;
  int64  chainID       = 3;
  string walletAddress = 4;
  string status        = 5;
  string verifiedAt    = 6;
  string chainKey      = 7;
}

message GetWalletBindingReq {
  string chainType     = 1;
  string walletAddress = 2;
  string chainKey      = 3;
}

message GetWalletBindingResp {
  string userID        = 1;
  string chainType     = 2;
  int64  chainID       = 3;
  string walletAddress = 4;
  string status        = 5;
  string challengeID   = 6;
  string verifiedAt    = 7;
  string chainKey      = 8;
}

// ─── Refund ───────────────────────────────────────────────────────────────────

message RequestRefundReq {
  string packetID  = 1;
  string chainType = 2;
  string chainKey  = 3;
}

message RequestRefundResp {
  string txHash = 1;
  string status = 2;
}

message GetRefundReq {
  string packetID  = 1;
  string chainType = 2;
  string chainKey  = 3;
}

message GetRefundResp {
  string packetID  = 1;
  string refundTo  = 2;
  string txHash    = 3;
  string amount    = 4;
  int64  createdAt = 5;
  string chainKey  = 6;
}

// ─── Admin ────────────────────────────────────────────────────────────────────

message SetSignerReq {
  string signerAddress = 1;
  string chainKey      = 2;
}

message SetSignerResp {
  string message = 1;
}

message SetTokenReq {
  string tokenAddress = 1;
  bool   allowed      = 2;
  string minAmount    = 3;
  string chainKey     = 4;
}

message SetTokenResp {
  string message = 1;
}

message SetExpiryReq {
  int64 expirySeconds = 1;
  string chainKey     = 2;
}

message SetExpiryResp {
  string message = 1;
}

message SetAllowAllTokensReq {
  bool allowAll = 1;
  string chainKey = 2;
}

message SetAllowAllTokensResp {
  string message = 1;
}

message SetNativeTokenEnabledReq {
  bool enabled = 1;
  string chainKey = 2;
}

message SetNativeTokenEnabledResp {
  string message = 1;
}

message ParseTxEventsReq {
  string chain  = 1;
  string txHash = 2;
  string chainKey = 3;
}

message ParseTxEventsResp {
  string chain  = 1;
  string txHash = 2;
  repeated ParsedEvent events = 3;
  string note   = 4;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service RedPacket {
  rpc CreateOrder(CreateOrderReq)           returns (CreateOrderResp);
  rpc CreatedCallback(CreatedCallbackReq)   returns (CreatedCallbackResp);
  rpc GetDetail(GetDetailReq)               returns (GetDetailResp);
  rpc IssueClaimSign(IssueClaimSignReq)     returns (IssueClaimSignResp);
  rpc ClaimResult(ClaimResultReq)           returns (ClaimResultResp);
  rpc RequestRefund(RequestRefundReq)       returns (RequestRefundResp);
  rpc GetRefund(GetRefundReq)               returns (GetRefundResp);

  rpc IssueWalletBindChallenge(IssueWalletBindChallengeReq) returns (IssueWalletBindChallengeResp);
  rpc ConfirmWalletBind(ConfirmWalletBindReq)               returns (ConfirmWalletBindResp);
  rpc GetWalletBinding(GetWalletBindingReq)                 returns (GetWalletBindingResp);

  rpc SetSigner(SetSignerReq)                       returns (SetSignerResp);
  rpc SetToken(SetTokenReq)                         returns (SetTokenResp);
  rpc SetExpiry(SetExpiryReq)                       returns (SetExpiryResp);
  rpc SetAllowAllTokens(SetAllowAllTokensReq)       returns (SetAllowAllTokensResp);
  rpc SetNativeTokenEnabled(SetNativeTokenEnabledReq) returns (SetNativeTokenEnabledResp);
  rpc ParseTxEvents(ParseTxEventsReq)               returns (ParseTxEventsResp);
}
