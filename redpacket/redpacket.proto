syntax = "proto3";
package openim.redpacket;

option go_package = "github.com/openimsdk/protocol/redpacket";

// ─── User-side messages ───────────────────────────────────────────────────────

message createOrderReq {
  string creator_user_id = 1;
  string creator_wallet  = 2;
  int32  packet_type     = 3;
  string token           = 4;
  string total_amount    = 5;
  int32  total_shares    = 6;
  int64  expiry_at       = 7;
  string chain           = 8;
}

message createOrderResp {
  string biz_id = 1;
}

message createdCallbackReq {
  string biz_id    = 1;
  string tx_hash   = 2;
  string packet_id = 3;
}

message createdCallbackResp {
  bool ok = 1;
}

message getDetailReq {
  string packet_id = 1;
}

message redPacketRecord {
  int64  id               = 1;
  string biz_id           = 2;
  string packet_id        = 3;
  int64  chain_id         = 4;
  string contract_address = 5;
  string creator_user_id  = 6;
  string creator_wallet   = 7;
  int32  packet_type      = 8;
  string token            = 9;
  string total_amount     = 10;
  int32  total_shares     = 11;
  int64  expiry_at        = 12;
  string tx_hash          = 13;
  string status           = 14;
  string chain            = 15;
  int64  created_at       = 16;
  int64  updated_at       = 17;
}

message claimRecord {
  int64  id             = 1;
  string packet_id      = 2;
  string claimer_wallet = 3;
  string auth_nonce     = 4;
  string claim_tx_hash  = 5;
  string claimed_amount = 6;
  int64  block_number   = 7;
  string status         = 8;
  int64  created_at     = 9;
  int64  updated_at     = 10;
}

message getDetailResp {
  redPacketRecord biz_record = 1;
  repeated claimRecord claims = 2;
}

message claimSignReq {
  string packet_id    = 1;
  string claimer      = 2;
  string user_id      = 3;
  string random_seed  = 4;
}

message claimSignResp {
  string auth_nonce   = 1;
  int64  deadline     = 2;
  string signature    = 3;
  string random_seed  = 4;
}

message claimResultReq {
  string packet_id      = 1;
  string claimer_wallet = 2;
  string tx_hash        = 3;
  string auth_nonce     = 4;
}

message claimResultResp {
  bool ok = 1;
}

// ─── Admin messages ───────────────────────────────────────────────────────────

message txResp {
  string tx_hash = 1;
}

message setSignerReq {
  string new_signer = 1;
  string chain      = 2;
}

message setTokenReq {
  string token            = 1;
  bool   allowed          = 2;
  string min_share_amount = 3;
  string chain            = 4;
}

message setExpiryReq {
  string duration = 1;
  string chain    = 2;
}

message setAllowAllTokensReq {
  bool   allow = 1;
  string chain = 2;
}

message setNativeTokenReq {
  bool   enabled = 1;
  string chain   = 2;
}

message parseTxEventsReq {
  string chain   = 1;
  string tx_hash = 2;
}

message txEvent {
  string name = 1;
  bytes  data = 2;
}

message parseTxEventsResp {
  repeated txEvent events = 1;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service RedPacket {
  rpc createOrder(createOrderReq) returns (createOrderResp);
  rpc createdCallback(createdCallbackReq) returns (createdCallbackResp);
  rpc getDetail(getDetailReq) returns (getDetailResp);
  rpc claimSign(claimSignReq) returns (claimSignResp);
  rpc claimResult(claimResultReq) returns (claimResultResp);

  rpc setSigner(setSignerReq) returns (txResp);
  rpc setToken(setTokenReq) returns (txResp);
  rpc setExpiry(setExpiryReq) returns (txResp);
  rpc setAllowAllTokens(setAllowAllTokensReq) returns (txResp);
  rpc setNativeToken(setNativeTokenReq) returns (txResp);
  rpc parseTxEvents(parseTxEventsReq) returns (parseTxEventsResp);
}
