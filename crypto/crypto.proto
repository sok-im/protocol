syntax = "proto3";
package openim.crypto;
option go_package = "github.com/openimsdk/protocol/crypto";

// ---------- Device ----------

message DeviceInfo {
  string deviceID = 1;
  string userID = 2;
  string platform = 3;
  string deviceModel = 4;
  string appVersion = 5;
  string virgilIdentity = 6;
  string status = 7;
  int64 lastSeenAt = 8;
  int64 createTime = 9;
}

message RegisterDeviceReq {
  string userID = 1;
  string deviceID = 2;
  string platform = 3;
  string deviceModel = 4;
  string appVersion = 5;
}

message RegisterDeviceResp {
  DeviceInfo device = 1;
}

message GetDevicesReq {
  string userID = 1;
}

message GetDevicesResp {
  repeated DeviceInfo devices = 1;
}

message RevokeDeviceReq {
  string userID = 1;
  string deviceID = 2;
}

message RevokeDeviceResp {
}

// ---------- Virgil JWT ----------

message GetVirgilJWTReq {
  string userID = 1;
  string deviceID = 2;
}

message GetVirgilJWTResp {
  string virgilJWT = 1;
  int64 expiresIn = 2;
  string virgilIdentity = 3;
}

// ---------- Group Key Version ----------

message GroupKeyVersionInfo {
  string groupID = 1;
  int64 groupKeyVersion = 2;
}

message GetGroupKeyVersionReq {
  string groupID = 1;
}

message GetGroupKeyVersionResp {
  string groupID = 1;
  int64 groupKeyVersion = 2;
}

message BumpGroupKeyVersionReq {
  string groupID = 1;
  string operatorUserID = 2;
  string eventType = 3;
}

message BumpGroupKeyVersionResp {
  string groupID = 1;
  int64 groupKeyVersion = 2;
}

// ---------- Group Key Event ----------

message GroupKeyEventInfo {
  string eventID = 1;
  string groupID = 2;
  int64 groupKeyVersion = 3;
  string eventType = 4;
  string operatorUserID = 5;
  int64 createTime = 6;
}

message GetGroupKeyEventsReq {
  string groupID = 1;
  int64 sinceVersion = 2;
}

message GetGroupKeyEventsResp {
  repeated GroupKeyEventInfo events = 1;
}

// ---------- Security ----------

message SecurityPrecheckReq {
  string userID = 1;
  string deviceID = 2;
  string action = 3;
}

message SecurityPrecheckResp {
  bool allowed = 1;
  string reason = 2;
}

message IntegrityReportReq {
  string userID = 1;
  string deviceID = 2;
  string reportData = 3;
  int64 timestamp = 4;
}

message IntegrityReportResp {
  bool accepted = 1;
}

// ---------- Service ----------

service CryptoService {
  // Device management
  rpc RegisterDevice(RegisterDeviceReq) returns (RegisterDeviceResp);
  rpc GetDevices(GetDevicesReq) returns (GetDevicesResp);
  rpc RevokeDevice(RevokeDeviceReq) returns (RevokeDeviceResp);

  // Virgil JWT
  rpc GetVirgilJWT(GetVirgilJWTReq) returns (GetVirgilJWTResp);

  // Group key version
  rpc GetGroupKeyVersion(GetGroupKeyVersionReq) returns (GetGroupKeyVersionResp);
  rpc BumpGroupKeyVersion(BumpGroupKeyVersionReq) returns (BumpGroupKeyVersionResp);
  rpc GetGroupKeyEvents(GetGroupKeyEventsReq) returns (GetGroupKeyEventsResp);

  // Security
  rpc SecurityPrecheck(SecurityPrecheckReq) returns (SecurityPrecheckResp);
  rpc IntegrityReport(IntegrityReportReq) returns (IntegrityReportResp);
}
